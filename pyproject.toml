[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-automation"
description = "Give it your resume, get the jobs that fit, select them and apply. Runs in your terminal, with a browser you can watch."
readme = "README.md"
keywords = ["jobs", "job-search", "resume", "job-applications", "browser-automation"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dynamic = ["version"]
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "duckdb>=1.1",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "mcp>=1.9",
    "openai>=1.40",
    "playwright>=1.48",
    "pypdf>=4",
    "pyyaml>=6",
    "rich>=13",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyarrow>=15"]  # pyarrow: the pipeline writes description files with it

[project.scripts]
agent-automation = "agent_automation.ui.worker:run"
agent-automation-tui = "agent_automation.ui.cli:run"

[project.urls]
Homepage = "https://github.com/khangpt2k6/agent-automation"
Issues = "https://github.com/khangpt2k6/agent-automation/issues"

[tool.hatch.version]
path = "src/agent_automation/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_automation"]

# The project's .agent/ home goes inside the package, where agent_automation.home looks for it in an install.
[tool.hatch.build.targets.wheel.force-include]
".agent" = "agent_automation/_home"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "browser: runs the real Chrome through tools/chrome.py",
    "letters: lets the session write cover letters, which every other test has off",
]

[tool.ruff]
line-length = 160
src = ["src", "tests"]
